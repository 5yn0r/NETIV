[workspace]
resolver = "3"
members = [
    "crates/netiv-core",
    "crates/netiv-topology",
    "crates/netiv-diagnostics",
    "crates/netiv-chaos",
    "crates/netiv-security",
    "crates/netiv-analysis",
    "crates/netiv-api",
    "crates/netiv-bin",
    "crates/netiv-education",
    "crates/netiv-cli",
    "crates/netiv-service",
    "crates/netiv-wasm",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = ""
authors = ["NETIV contributors"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
netiv-core = { path = "crates/netiv-core" }
netiv-topology = { path = "crates/netiv-topology" }
netiv-diagnostics = { path = "crates/netiv-diagnostics", default-features = false }
netiv-chaos = { path = "crates/netiv-chaos", default-features = false }
netiv-security = { path = "crates/netiv-security", default-features = false }
netiv-analysis = { path = "crates/netiv-analysis", default-features = false }
netiv-education = { path = "crates/netiv-education", default-features = false }
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
netiv-cli = { path = "crates/netiv-cli", default-features = false }
netiv-api = { path = "crates/netiv-api" }
netiv-service = { path = "crates/netiv-service", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# Compilation du module WebAssembly (`wasm-pack build --profile wasm-release`) :
# priorité à la taille, sans toucher au profil `release` de la CLI native.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
