name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-secrets.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Résultats identiques sans le multi-thread (configuration WebAssembly).
      - run: cargo test -p netiv-diagnostics -p netiv-security -p netiv-analysis -p netiv-education -p netiv-cli -p netiv-service --no-default-features

  # Garde-fou : le moteur doit rester compilable pour le navigateur.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check --target wasm32-unknown-unknown --no-default-features
          -p netiv-core -p netiv-topology -p netiv-diagnostics -p netiv-chaos
          -p netiv-security -p netiv-analysis -p netiv-education -p netiv-cli
          -p netiv-service -p netiv-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils (wasm-pack, wasm-opt), versions figées
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C ~/.cargo/bin wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar xz --strip-components=2 -C ~/.cargo/bin binaryen-version_133/bin/wasm-opt
      - run: crates/netiv-wasm/build-web.sh
      # Le vrai module : sorties identiques au natif (scénario golden), défi, éditeur.
      - run: node crates/netiv-wasm/tests/wasm.mjs
      - name: Taille du module compressé (objectif ≤ 1,5 Mo)
        run: test "$(gzip -9 -c crates/netiv-wasm/dist/netiv_wasm_bg.wasm | wc -c)" -le 1572864
