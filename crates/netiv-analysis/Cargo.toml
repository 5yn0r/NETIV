[package]
name = "netiv-analysis"
description = "Analyse d'un réseau : accessibilité, what-if, score de santé, documentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["parallel"]
# Exécution des sondes sur plusieurs threads. Sans cette feature (cible
# WebAssembly), tout s'exécute en séquentiel, avec des résultats identiques.
parallel = ["netiv-diagnostics/parallel", "netiv-security/parallel"]

[dependencies]
netiv-core = { workspace = true }
netiv-topology = { workspace = true }
netiv-diagnostics = { workspace = true }
netiv-security = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

[lints]
workspace = true
