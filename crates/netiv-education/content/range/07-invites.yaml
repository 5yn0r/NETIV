id: range-07
title: Un invité fouille les serveurs
difficulty: medium
description: |
  ALERTE — Le routeur du siège voit des connexions du VLAN invités vers la salle
  serveurs. Normalement, un invité n'a droit qu'à Internet.

  Identifie le poste et ce qu'il fait, puis rétablis l'isolement des invités
  sans gêner les employés ni l'agence.
time_limit_minutes: 25
topology_ref: multisite
faults:
  - acl_insert:
      device: R-SIEGE
      rule: { action: allow, src: 192.168.30.0/24, dst: 192.168.50.0/24, in: eth1, comment: "test imprimante invités" }
traffic:
  - { at_s: 4, from: INV1, to: 192.168.50.10, proto: tcp, ports: [21, 22, 23, 80, 443, 445, 3389, 8080], every_ms: 500 }
culprit:
  device: INV1
  behavior: port-scan
must_block:
  - { from: INV1, to: 192.168.50.10, service: { proto: tcp, port: 22 } }
  - { from: INV1, to: 192.168.50.10, service: { proto: tcp, port: 445 } }
  - { from: INV1, to: 192.168.50.30, service: { proto: tcp, port: 8080 } }
must_work:
  - { from: INV1, to: 198.51.100.10, service: { proto: tcp, port: 80 } }
  - { from: PC-S1, to: 192.168.50.10, service: { proto: tcp, port: 443 } }
  - { from: PC-A1, to: 192.168.50.30, service: { proto: tcp, port: 8080 } }
solution:
  explanation: |
    INV1 essaie un à un les ports de SRV-WEB : un balayage. La règle « test
    imprimante invités », placée en tête, passe avant les interdictions. La retirer
    rétablit l'isolement.
  commands: ["acl del R-SIEGE 1"]
