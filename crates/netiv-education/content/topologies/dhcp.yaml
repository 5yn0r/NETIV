# DHCP et DNS : deux réseaux de postes servis par un serveur central.
#
#   PC1, PC2, IMP ── SW1 ── R1 ── SW2 ── SRV (DHCP + DNS + web), PC3
#     10.10.1.0/24   relais     10.10.2.0/24
#
# Les postes n'ont aucune adresse écrite : ils la demandent au démarrage
# (l'imprimante IMP, elle, a une adresse fixe).
# R1 relaie les demandes du réseau 10.10.1.0/24 (une diffusion DHCP ne
# traverse jamais un routeur toute seule).
#
#   netiv> show dhcp SRV
#   netiv> trace 1                 # l'échange DORA de PC1, relais compris
#   netiv> ping PC1 web.lan        # résolution DNS, puis ping
network:
  name: dhcp
  seed: 3

devices:
  - name: PC1
    type: host
    interfaces: [{ name: eth0, ip: dhcp }]
  - name: PC2
    type: host
    interfaces: [{ name: eth0, ip: dhcp }]
  - name: IMP
    type: host
    role: iot
    interfaces: [{ name: eth0, ip: 10.10.1.50/24 }]
    gateway: 10.10.1.1
  - name: SW1
    type: switch
    ports: 4

  - name: R1
    type: router
    interfaces:
      - { name: eth0, ip: 10.10.1.1/24, dhcp_relay: 10.10.2.10 }
      - { name: eth1, ip: 10.10.2.1/24 }

  - name: SW2
    type: switch
    ports: 4
  - name: SRV
    type: server
    interfaces: [{ name: eth0, ip: 10.10.2.10/24 }]
    gateway: 10.10.2.1
    services:
      - { proto: tcp, port: 80, name: http }
    dhcp:
      pools:
        - { network: 10.10.1.0/24, range: 10.10.1.100-10.10.1.150, gateway: 10.10.1.1, dns: 10.10.2.10 }
        - { network: 10.10.2.0/24, range: 10.10.2.100-10.10.2.150, gateway: 10.10.2.1, dns: 10.10.2.10 }
    dns_server:
      records:
        web.lan: 10.10.2.10
        srv.lan: 10.10.2.10
        routeur.lan: 10.10.1.1
  - name: PC3
    type: host
    interfaces: [{ name: eth0, ip: dhcp }]

links:
  - { a: "PC1:eth0", b: "SW1:port1" }
  - { a: "PC2:eth0", b: "SW1:port2" }
  - { a: "IMP:eth0", b: "SW1:port3" }
  - { a: "SW1:port4", b: "R1:eth0" }
  - { a: "R1:eth1", b: "SW2:port1" }
  - { a: "SW2:port2", b: "SRV:eth0" }
  - { a: "SW2:port3", b: "PC3:eth0" }
