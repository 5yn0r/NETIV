# Trois routeurs en ligne, routage statique.
#
#   PC1 ─ R1 ─ R2 ─ R3 ─ SRV (http)
network: { name: triangle, seed: 31 }
devices:
  - name: PC1
    type: host
    interfaces: [{ name: eth0, ip: 10.1.0.10/24 }]
    gateway: 10.1.0.1
  - name: R1
    type: router
    interfaces:
      - { name: eth0, ip: 10.1.0.1/24 }
      - { name: eth1, ip: 10.12.0.1/30 }
    routes:
      - { dest: 10.3.0.0/24, via: 10.12.0.2 }
      - { dest: 10.23.0.0/30, via: 10.12.0.2 }
  - name: R2
    type: router
    interfaces:
      - { name: eth0, ip: 10.12.0.2/30 }
      - { name: eth1, ip: 10.23.0.1/30 }
    routes:
      - { dest: 10.1.0.0/24, via: 10.12.0.1 }
      - { dest: 10.3.0.0/24, via: 10.23.0.2 }
  - name: R3
    type: router
    interfaces:
      - { name: eth0, ip: 10.23.0.2/30 }
      - { name: eth1, ip: 10.3.0.1/24 }
    routes:
      - { dest: 10.1.0.0/24, via: 10.23.0.1 }
      - { dest: 10.12.0.0/30, via: 10.23.0.1 }
  - name: SRV
    type: server
    interfaces: [{ name: eth0, ip: 10.3.0.10/24 }]
    gateway: 10.3.0.1
    services: [{ proto: tcp, port: 80, name: http }]
links:
  - { a: "PC1:eth0", b: "R1:eth0" }
  - { a: "R1:eth1", b: "R2:eth0" }
  - { a: "R2:eth1", b: "R3:eth0" }
  - { a: "R3:eth1", b: "SRV:eth0" }
