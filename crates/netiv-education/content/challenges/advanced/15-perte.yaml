id: advanced-05
title: Un lien qui perd des trames
topic: physical
difficulty: hard
description: |
  Le réseau marche… par intermittence. Certains pings passent, d'autres non, et
  le résultat change d'une fois sur l'autre. Cherche dans la trace les trames
  qui disparaissent.
time_limit_minutes: 25
topology_ref: office
objective: { from: PC1, to: 192.168.2.10 }
faults:
  - link_loss: { a: "R1:eth1", loss: 0.6 }
solution:
  cause: packet-loss
  device: R1
  explanation: |
    Le câble entre R1 et R2 perd 60 % des trames (liaison dégradée). Les trames
    « perdues sur le lien » apparaissent dans la trace. Sur du matériel réel on
    remplacerait le câble ou le port.
  commands: ["loss R1 eth1 0"]
