[package]
name = "netiv-chaos"
description = "Chaos Engine : catalogue de pannes et injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["parallel"]
# Exécution des sondes sur plusieurs threads. Sans cette feature (cible
# WebAssembly), tout s'exécute en séquentiel, avec des résultats identiques.
parallel = ["netiv-diagnostics/parallel"]

[dependencies]
netiv-core = { workspace = true }
netiv-diagnostics = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
netiv-topology = { workspace = true }

[lints]
workspace = true
