[package]
name = "netiv-diagnostics"
description = "Sondes, diagnostic de pannes (cause racine), indices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["parallel"]
# Exécution des sondes sur plusieurs threads. Sans cette feature (cible
# WebAssembly), tout s'exécute en séquentiel, avec des résultats identiques.
parallel = []

[dependencies]
netiv-core = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
netiv-topology = { workspace = true }

[lints]
workspace = true
